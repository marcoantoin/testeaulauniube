        <title>ℂ𝕒𝕞𝕒𝕣𝕘𝕠𝕋𝕖𝕔𝕙</title>

    <body>
       

            <h1 style="font-size: 200%;">Voltar página anterior</Style> <a href="index.html"  title="paginainicial">Página Inicial</a></h1>

            <h2 style="font-size: 250%; text-align: center;">Central de Suporte</h2>

            <form style="font-size: 170%; text-align: center;">
            <label>Nome:</label>
            <input type="text" required>

            <br><br>

            <label>E-mail</label>
            <input type="email" required>

            <br><br>

            <label>Tipo de Problema:</label>
            <br>

            <input type="Radio" name="Problema" value="Hardware" required>
            Hardware

            <input type="Radio" name="Problema" value="Software" required>
            Software

            <input type="Radio" name="Problema" value="Rede" required>
            Rede

            <br><br>

            <label>Sistema Operacional:</label>

            <select required>
                <option value="">Selecione uma opção</option>
                <option value="Windows">Windows</option>
                <option value="Linux">Linux</option>
                <option value="MacOS">MacOS</option>
            </select>

            <br><br>

            <label>Descrição do Problema</label>
            <br>

            <textarea rows="6" cols="50" required></textarea>

            <br><br>

            <button type="submit">Enviar Solicitação</button>
            </form>
            
            <a href="https://uniube.br" title="Site da Uniube" target="_blank">
            <img src="https://uniube.br/img/landing/logo_branca.svg" alt="Logo Uniube" style="position: fixed; bottom: 20px; right: 20px; width: 120px; height: auto;">
